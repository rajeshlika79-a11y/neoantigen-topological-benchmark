pipeline:
  random_seed: 42
  n_jobs: 8

data:
  cutoff_distance_angstrom: 8.0
  mmseqs2_identity_threshold: 0.40
  primary_benchmark_size: 1428
  clinical_cohort_size: 215

tda:
  max_homology_dim: 2
  filtration_max_scale: 15.0
  landscape_grid_points: 50
  num_landscape_layers: 4

xgboost_hyperparameters:
  n_estimators: 300
  learning_rate: 0.03
  max_depth: 5
  subsample: 0.8
  colsample_bytree: 0.7
  min_child_weight: 3
  objective: "binary:logistic"
  eval_metric: "logloss"
  random_state: 42
